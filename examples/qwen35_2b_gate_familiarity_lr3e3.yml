# Stage 1 of the learned-admission screen: a gate reading both context and update
# geometry, on a frozen backbone.
#
# The intervention study established that fixed unit FFN admission is the wrong strength
# in an identifiable regime: on familiar contexts, scaling layer 12's proposal down
# improved held-out content NLL by 0.0514 nats (t -39.3), monotonically in the scale
# factor, replicated at -0.0520 on a disjoint corpus, with the sign flipping on rare
# contexts. Neighbouring layers behaved differently -- 14 and 16 improved, 10 got worse.
#
# The question here is whether the model can find that policy itself from cross-entropy
# alone. Frozen backbone first, because that is the clean mechanistic test: if a learned
# gate cannot beat stock while a hand-chosen fixed rule does, the problem is the
# parameterization or the optimization, not the hypothesis. Co-adaptation is a separate
# experiment and only runs if this one is positive.
#
# The learning-rate diagnostic for the combined gate. See the learning_rate comment: the
# screen's gates ran out of travel before they ran out of gradient, and a result that is
# bounded by the optimizer budget is not a result about the architecture.
#
# The arm that decides whether familiarity is worth its machinery. If this matches the
# geometry-only gate, context carries nothing the layer could not already infer from its
# own proposal, and the trigram cache is dead weight in any eventual architecture.
#
# Identical to examples/qwen35_2b_gate_familiarity.yml except for residual_gate.family
# and output_path.

model: D:/DeepThought/Projects/HybridModel/student-2b-hf
output_path: D:/DeepThought/Projects/HybridModel/runs/gate-familiarity-lr3e3
project_name: hybridmodel-residual-gate

sequence_length: 4096

dataset:
  seed: 42

teacher:
  # The same cached corpus the co-adaptation arms trained on, for data parity with every
  # earlier screen. Its logits are not used: the objective below is ground-truth CE only.
  kind: dataset
  cache_path: D:/DeepThought/Projects/HybridModel/teacher-cache-5m
  anchor_layers: [8, 64]
  cache_dtype: float8_e4m3fn

model_kwargs:
  device_map: cuda:0

residual_gate:
  # 12, 14 and 16 are where attenuation helped; 10 is where it hurt. Gating all four is
  # what makes the mechanistic check possible at all -- a gate that only sees layers
  # where the answer is "admit less" cannot demonstrate that it learned depth-dependent
  # behaviour rather than a constant.
  layers: [10, 12, 14, 16]
  family: familiarity
  hidden: 16
  # Reachable admission (0, 2), which covers the whole measured alpha curve including
  # the alpha = 0 endpoint that was best. The parameterization is never the reason a
  # value is out of reach.
  span: 1.0
  familiarity_cache: scratch/ffn_memo/cache/layer-12.npz
  calibration_batches: 8

loss_functions:
  - function: assistant_cross_entropy
    weight: 1.0

optimizer:
  strategy: adamw
  # Only the gate trains. freeze_backbone_for_stage1 finds it through
  # architecture_parameter_ids, which recognises ResidualAdmissionGate.
  freeze_backbone: true
  freeze_sidecar: false
  unfreeze_at_step: null
  log_every_n_steps: 10

chunked_head: true
chunked_cross_entropy: true
sortish_batching: true
functionary_packing: false
use_flash_attention: false
# The backbone is frozen and holds no optimizer state, so this run is far under the
# co-adaptation arms' 15.5 GiB. The cap is enforced by the allocator: an overrun raises
# instead of paging into shared system memory, which on Windows is a 70x slowdown rather
# than an error.
max_vram_fraction: 0.9

training_args:
  bf16: true
  remove_unused_columns: false
  dataloader_num_workers: 0
  # A few hundred parameters train; 8-bit moments would be pointless machinery.
  optim: adamw_torch
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  # ~250K supervised tokens at the measured 880 per update, matching the co-adaptation
  # screens exactly.
  max_steps: 284
  # A diagnostic arm, not a sweep. The 3e-4 screen ended with a reach of 0.06 to 0.24 --
  # the furthest any of its gates could deviate from unit admission for any input -- so
  # it could not have expressed the alpha = 0 policy the fixed rule used even if cross
  # entropy had asked it to. Ten times the rate answers one question: is the small effect
  # a ceiling, or a travel budget?
  learning_rate: 3.0e-3
  lr_scheduler_type: cosine
  warmup_steps: 5
  max_grad_norm: 1.0
  logging_steps: 10
  eval_strategy: steps
  # Every ~50K supervised tokens. Each evaluation writes a gate checkpoint; the backbone
  # cannot move, so nothing else is worth writing.
  eval_steps: 57
  per_device_eval_batch_size: 1
  save_strategy: "no"
  report_to: tensorboard
  seed: 42
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
