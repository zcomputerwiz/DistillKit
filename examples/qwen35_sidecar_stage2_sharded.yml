# Stage-2 sidecar distillation, student sharded across two RTX 3090s.
#
# Stage 1 froze the backbone so the sidecar's contribution was attributable. Stage 2
# unfreezes everything, which is what does not fit on one card.
#
# NOTE: `model:` below is the stock student, not stage 1's output, so this trains the
# whole thing jointly from a zero-initialised sidecar rather than continuing stage 1.
# That is deliberate as a baseline -- it reached eval_loss 0.5347 against the stage-1
# arm's 0.5807 -- but it is not the staged curriculum. To chain the stages instead,
# point `model:` at D:/DeepThought/Projects/HybridModel/runs/sidecar-1m; note that
# `distillation_projections.*` are saved into the checkpoint but reload as UNEXPECTED
# (they belong to the trainer, not the architecture), so the projections restart either
# way.
#
# The memory problem is the same for both:
#
#   4.27B parameters x (2 bf16 weight + 2 bf16 grad + 2 AdamW8bit m/v) = 25.6 GB
#
# before a single activation, against 24 GB of VRAM. Splitting the layers across both
# cards is what makes stage 2 possible at all.
#
# The split is a single-process layer assignment, not a distributed job. There is no
# torchrun, no process group, and no NCCL: `Tensor.to(device)` is differentiable, so
# autograd moves activations forward and gradients back on its own, over NVLink where
# peer access is available. HF Trainer sees `hf_device_map`, sets
# `place_model_on_device=False`, and forces `_n_gpu` to 1 so it does not additionally
# wrap the model in DataParallel.
#
# This is capacity parallelism, not throughput parallelism. Each microbatch still
# traverses card 0 then card 1 in sequence, so expect roughly single-card speed, not
# double. Overlapping microbatches (1F1B) is a separate change to the training loop.
#
# Run with BOTH cards visible -- unlike the stage-1 configs, which pin
# CUDA_VISIBLE_DEVICES=0 to keep DataParallel out of the way:
#   python -m distillkit.main examples/qwen35_sidecar_stage2_sharded.yml -v

model: D:/DeepThought/Projects/HybridModel/student-hf
output_path: D:/DeepThought/Projects/HybridModel/runs/sidecar-stage2
project_name: hybridmodel-sidecar

sequence_length: 4096

dataset:
  seed: 42

teacher:
  kind: dataset
  cache_path: D:/DeepThought/Projects/HybridModel/teacher-cache-1m
  anchor_layers: [8, 64]
  cache_dtype: float8_e4m3fn

model_kwargs:
  # Explicit, not device_map "auto": accelerate's automatic map balances raw weights
  # and knows nothing about gradients, optimizer state, or the 248,320-wide head's
  # activation cost, all of which land on card 0 with the head.
  #
  # Balanced from measurement, not arithmetic. At 9 layers on card 0 the run reported
  # (vram/* metrics, logged every step):
  #   card 0  peak 16.86 GiB, RESERVED 20.75 GiB
  #   card 1  peak 15.74 GiB, reserved 16.29 GiB
  # and died asking for 1024 MiB. The peak was survivable; the 3.9 GiB gap between
  # card 0's peak and its reservation was not, and Windows cannot defragment it --
  # torch warns "expandable_segments not supported on this platform" and keeps the
  # native allocator. Card 1 fragments only 0.55 GiB because it holds no head.
  #
  # Moving three layers to card 1 dropped card 0's peak to 14.99 GiB and left its
  # reservation at 20.36 -- reducing live memory does not reclaim a stranded segment --
  # and then card 1 died instead at 20.37 GiB allocated with only 0.83 GiB unallocated.
  # Both failures were marginal, about 1 GiB short, from opposite directions.
  #
  # Rebalanced to 13 once the anchor tap and the folded head removed card 0's head
  # activations. Measured peak at sequence 4096, batch 1, full backbone trainable:
  #
  #   boundary  7:  card 0 12.46 GiB   card 1 20.12 GiB   <- card 1 nearly at the cap
  #   boundary 11:  card 0 14.97 GiB   card 1 17.61 GiB
  #   boundary 13:  card 0 16.21 GiB   card 1 15.99 GiB   <- both ~6.6 GiB clear
  #
  # At 7 the split was badly memory-imbalanced: card 1 held 25 layers and sat 2.7 GiB
  # from the cap while card 0 had 10 GiB idle, which is what left no room for the
  # fragmentation that killed earlier runs. Compute balance wants 18, but that OOMs --
  # card 0 would hold 15.0 GiB of weights, gradients and AdamW8bit state for 18 layers
  # plus the embeddings, and the activations do not fit on top. 13 is the memory
  # optimum and happens to sit closer to compute balance than 7 did.
  #
  # embed_tokens and lm_head must share a device: tie_word_embeddings is true, so they
  # are one parameter. Splitting them fabricates a second copy that trains apart and
  # reconstructs into a checkpoint matching neither. main.py rejects that at load.
  device_map:
    model.embed_tokens: 0
    model.rotary_emb: 0
    model.norm: 0
    lm_head: 0
    model.layers.0: 0
    model.layers.1: 0    # the sidecar layer; its ngram_raw arrives on card 0
    model.layers.2: 0
    model.layers.3: 0
    model.layers.4: 0
    model.layers.5: 0
    model.layers.6: 0
    model.layers.7: 0
    model.layers.8: 0
    model.layers.9: 0
    model.layers.10: 0
    model.layers.11: 0
    model.layers.12: 0
    model.layers.13: 1
    model.layers.14: 1
    model.layers.15: 1
    model.layers.16: 1
    model.layers.17: 1
    model.layers.18: 1
    model.layers.19: 1
    model.layers.20: 1
    model.layers.21: 1
    model.layers.22: 1
    model.layers.23: 1
    model.layers.24: 1
    model.layers.25: 1
    model.layers.26: 1
    model.layers.27: 1
    model.layers.28: 1
    model.layers.29: 1
    model.layers.30: 1
    model.layers.31: 1

sidecar:
  table_path: C:/Users/Owner/.cache/huggingface/hub/models--unsloth--Qwen3.8-Flash-Next-GGUF/snapshots/38bb39ee97821de2c9009abb7e93950eec396e66/UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00002-of-00003.gguf
  enabled: true
  resident: true
  prefault: true
  layer_index: 1
  num_branches: 4

# Anchor 4 is layer 3's output and anchor 32 is the post-norm state. Both projections
# are built on card 0 regardless of the map: accelerate's root hook returns the whole
# output tuple to the input device.
layer_mapping:
  - [4, 0]
  - [32, 1]

loss_functions:
  - function: kl
    weight: 0.7
    temperature: 1.0
    missing_probability_handling: zero
    sparse_chunk_length: 256
  - function: hs_cosine
    weight: 0.3

optimizer:
  # Not `hybrid`: Muon's Newton-Schulz iterations would run on 4.27B parameters here,
  # and the memory win in stage 2 comes from 8-bit moments. adamw defers to
  # training_args.optim, which selects bitsandbytes below. bnb keeps each state tensor
  # on its parameter's own card, so the split holds through the optimizer.
  strategy: adamw
  freeze_backbone: false
  unfreeze_at_step: null
  log_every_n_steps: 1     # diagnostic: per-step VRAM until the split is settled

use_flash_attention: false  # no Windows wheels; training_args.bf16 sets the load dtype
functionary_packing: false
chunked_cross_entropy: true
# Project lm_head inside the loss chunk loop instead of materializing
# [1, 4096, 248320] logits (1.89 GiB) and their gradient (1.89 GiB again), for
# identical loss and gradients.
#
# OFF here, because it is a memory-for-compute trade and memory is no longer the
# binding constraint. The head is recomputed during backward, which measured at
# boundary 13, sequence 1024:
#
#   chunked_head: true    955 tok/s   card 0 13.50 GiB
#   chunked_head: false   997 tok/s   card 0 15.16 GiB
#
# OFF at batch 1: it costs 4.4% of throughput (955 vs 997 tok/s) to save 1.66 GiB,
# and memory is not the binding constraint since the grouped-query fix. Turn it back
# on whenever what it eliminates grows -- it scales with batch x sequence, so at
# [4, 4096, 248320] the logits are 7.6 GiB and their gradient another 7.6 GiB, and a
# ZeRO-2 rank needs it to fit at full sequence length.
chunked_head: false
# 0.92 left 1.9 GiB of the card unused while both arms were failing by about 1 GiB.
# The cap exists to turn a silent WDDM spill into a loud OOM, and 0.95 still does that
# -- measured context overhead on this box is ~0.6 GiB, so 22.8 GiB allowed of 24.
max_vram_fraction: 0.95     # applied to every visible device

training_args:
  bf16: true
  remove_unused_columns: false
  dataloader_num_workers: 0
  optim: adamw_bnb_8bit
  # Batch 4 only works with the grouped sampler below. A batch pads to its longest
  # member, and this corpus is median 545 / max 4096 tokens, so simulated over the
  # real length distribution with HF's own sampler:
  #
  #   batch 1                        0.0% waste    997 tok/s
  #   batch 2 random / grouped      28.8% / 2.5%   747 / 1024 tok/s
  #   batch 4 random / grouped      49.7% / 3.5%   549 / 1053 tok/s
  #
  # Randomly batched, 4 is a 45% loss; grouped it is a 6% gain.
  # Stays 1. Batching needs length grouping to be worth anything on this corpus
  # (median 545 / max 4096 tokens): randomly batched, 4 wastes 49.7% of padded
  # tokens; grouped, 3.5%. But grouping then requires chunked_head, whose recompute
  # cancels most of the padding saving, and sorting by length gives every step a
  # different shape -- which fragmented the allocator into an OOM at step 18 with
  # 6.12 GiB reserved but unallocated, and Windows has no expandable_segments to
  # recover. Revisit `train_sampling_strategy: group_by_length` with batch 4 if
  # something else forces a larger effective batch; the cache dataset already
  # provides the `length` column that sampler wants.
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  num_train_epochs: 1
  # An order of magnitude below stage 1: that run only moved 65.5M sidecar parameters
  # against a fixed backbone, and reusing its 1e-4 on the full backbone would wash out
  # what the frozen-backbone arm established.
  learning_rate: 1.0e-5
  lr_scheduler_type: cosine
  warmup_steps: 50
  max_grad_norm: 1.0
  logging_steps: 5
  eval_strategy: steps
  eval_steps: 50
  per_device_eval_batch_size: 1
  save_strategy: steps
  save_steps: 200
  save_total_limit: 2
  report_to: tensorboard
  seed: 42
