# The first native-table experiment: a student-owned trainable n-gram table, frozen
# backbone, cross entropy only. NOT YET LAUNCHED -- this file is the configuration the
# memory smoke test justifies, written so the run is one command when it is approved.
#
# Everything the objective forensics ruled out is absent: no teacher KL, no hidden-state
# cosine, no GR, no QSA. The teacher section is present because the schema requires one and
# because the cache is what supplies the documents. No teacher signal is ever read:
# `assistant_cross_entropy` declares `requires_teacher_signal() == False`, so the trainer
# skips the per-microbatch cache fetch entirely.
#
# Measured on one RTX 3090 (24 GiB), CUDA_VISIBLE_DEVICES=0, backbone frozen with the
# prefix outside autograd, bf16, chunked head, non-reentrant checkpointing, twelve timed
# steps each through a real AdamW update (scratch/native_table/benchmark.json):
#
#   seq 4096 x1  checkpointing on   2456 tok/s   1.667 s/step   12.26 / 13.74 GiB  <- this
#   seq 4096 x2  checkpointing on   2221 tok/s   3.688 s/step   18.34 / 19.03 GiB
#   seq 4096 x1  checkpointing off  refused: needs 22.4 GiB allocated, 24.0 GiB reserved
#   seq 4096 x2  checkpointing off  refused: needs 39.4 GiB allocated, 50.6 GiB reserved
#
# Checkpointing off is 21% faster per token (2966 tok/s) and takes the entire card to get
# it, so it is disqualified rather than chosen. Batch 2 is slower per token AND holds 19
# GiB. Batch 1 is therefore both the fastest and the roomiest, and it runs at
# accumulation 1: one optimizer update per 4,096 tokens (see training_args).
#
# The refusals above are enforced, not observed: Windows WDDM does not raise on an
# oversized allocation, it pages to host RAM and runs about seventy times slower, so
# `max_vram_fraction` caps the allocator and the benchmark checks reserved VRAM and host
# RSS after every step (scratch/native_table/vram_guard.py).
#
# rho starts at exactly zero, which means nothing inside the block receives gradient until
# rho itself has moved. That gate is opened before the run rather than inside it, so the
# screen begins with a model whose table, projections and convolution are already
# learning, and so the tokens it cost are accounted for separately:
#
#   .venv/Scripts/python.exe scratch/native_table/bootstrap_rho.py \
#       --output D:/DeepThought/Projects/HybridModel/runs/native-ple-2b-bootstrap
#
# One forward, one backward, one update, 4,096 tokens: rho 0 -> 1.0014e-4, backbone
# bitwise unchanged, and the table, both projections and the convolution all carrying
# gradient afterwards. Point `model:` at that checkpoint and the 4,096 tokens it spent are
# reported separately from the experiment's own budget.

# Point this at the bootstrap checkpoint once rho has been opened (see the note above).
# The base checkpoint below is an exact morph of the pretrained student -- rho is zero, so
# the sidecar contributes nothing and nothing inside it learns until rho has moved.
model: D:/DeepThought/Projects/HybridModel/runs/native-ple-2b-bootstrap
# The base checkpoint, for a run that wants to open the gate itself:
# model: D:/DeepThought/Projects/HybridModel/student-2b-hf
output_path: D:/DeepThought/Projects/HybridModel/runs/native-ple-2b-ce
project_name: hybridmodel-native-ple

sequence_length: 4096

dataset:
  seed: 42

teacher:
  kind: dataset
  cache_path: D:/DeepThought/Projects/HybridModel/teacher-cache-5m
  anchor_layers: [8, 64]
  cache_dtype: float8_e4m3fn

model_kwargs:
  device_map: cuda:0

sidecar:
  enabled: true
  # No table_path: the rows are the model's own parameters, and a native checkpoint
  # never needs the donor GGUF again.
  table_mode: native
  ngram_vocab_size_base: 131072
  variant: ple
  layer_index: 1
  # ple_embed_dim defaults to hidden_size, which is what puts the 16 concatenated rows
  # at stream width: 2048 / 16 = 128 values per row, 2,099,200 rows, 268,697,600
  # parameters, 0.50 GiB in bf16.

loss_functions:
  # Ground-truth CE on assistant tokens, and nothing else. The objective forensics
  # (scratch/ple_forensics/RESULTS.md) found that both distillation terms invert the
  # sidecar's effect on content: the sparse KL punishes corrections toward true tokens
  # outside the teacher's top-64, and the hidden-state cosine recruits an upstream module
  # as a teacher-coordinate matching actuator. A first proof of the table should not be
  # fighting either of those.
  - function: assistant_cross_entropy
    weight: 1.0

optimizer:
  strategy: adamw
  # Stage 1 semantics: only the sidecar trains, which here is the table, the reference
  # PLE block and the admission scalar -- 277.1M parameters against the backbone's 1.88B.
  freeze_backbone: true
  unfreeze_at_step: null
  log_every_n_steps: 10

chunked_head: true
chunked_cross_entropy: true
sortish_batching: true
functionary_packing: false
use_flash_attention: false   # no Windows wheels; training_args.bf16 sets the load dtype
max_vram_fraction: 0.9       # 12.58 GiB reserved of 24 leaves the headroom this enforces

training_args:
  bf16: true
  remove_unused_columns: false
  dataloader_num_workers: 0
  optim: adamw_torch
  per_device_train_batch_size: 1
  # Accumulation 1, not 8. Every step in this section is an optimizer step, and at
  # accumulation 8 each one costs 32,768 tokens, which would make the 100K screen three
  # updates long -- the warmup alone would outlast the entire nominal 1M-token run. The
  # benchmark says a real AdamW update every microbatch sustains 2456 tok/s at 12.26 GiB,
  # so amortizing the optimizer buys nothing worth three orders of magnitude fewer
  # updates. The table is random and newly admitted: updates per token is the quantity
  # that matters. A larger effective batch is a question for after a positive signal.
  gradient_accumulation_steps: 1
  # One update = 4096 tokens, so the nominal screens land at:
  #   update  25 = 102,400 tokens      update 125 =   512,000
  #   update  50 = 204,800              update 250 = 1,024,000
  #   update  75 = 307,200
  # 250 rather than the 244 that lands nearest 1M, because the last automatic evaluation
  # would then be update 225: HF runs no final evaluation merely because training ended,
  # so an endpoint off the eval cadence silently throws the endpoint away. Six extra
  # updates is cheaper than a special-case final-eval path. max_steps also gives the
  # cosine schedule something definite to decay over; a `num_train_epochs: 1` cosine
  # would have been shaped by the size of the cache instead.
  max_steps: 250
  # The table starts random and has to learn something from scratch, unlike a retrofit
  # nudging pretrained weights; rho starts at zero and has to travel before anything
  # inside the block sees gradient at all.
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 5
  max_grad_norm: 1.0
  logging_steps: 5
  eval_strategy: steps
  # Every 25 updates is roughly every 100K tokens, so the milestones read off directly:
  # update 25 is the 100K screen, 50 and 75 bracket 250K, 125 is 500K, 250 is 1M. Logged
  # `supervised_tokens` is the exact count -- positions that carried gradient, padding and
  # unsupervised positions excluded -- and is what the screens should be reported against.
  eval_steps: 25
  per_device_eval_batch_size: 1
  save_strategy: steps
  # 2.15B parameters go to disk on every save whether or not they moved, so this is
  # deliberately coarser than the eval cadence: every 60 updates is roughly 250K tokens.
  save_steps: 60
  save_total_limit: 2
  report_to: tensorboard
  seed: 42
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
